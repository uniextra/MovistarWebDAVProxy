<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Movistar & O2 WebDAV Proxy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Cpath d='M25 58h50a15 15 0 0 0 0-30 22 22 0 0 0-42-5 18 18 0 0 0-8 35z' fill='white'/%3E%3C/svg%3E">
    <script>
        // Tema: el elegido con el botón (guardado en el navegador) o, si no hay, el del sistema.
        // Se aplica antes de pintar para evitar el destello blanco al cargar en modo oscuro.
        (function () {
            let saved = null;
            try { saved = localStorage.getItem('mc_theme'); } catch (e) {}
            const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>    
    <!-- 1. Carga externa controlada con CORS y sin Referer -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com" referrerpolicy="no-referrer"></script>
    <!-- 2. Estilos locales limpios (sin @import externo) -->
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }

        /* ---- Modo oscuro: reinterpreta los colores claros de la plantilla ---- */
        html.dark { color-scheme: dark; }
        html.dark body { background-color: #0b1120; color: #e2e8f0; }
        html.dark .bg-white { background-color: #141b2a; }
        html.dark .bg-slate-50 { background-color: #1a2233; }
        html.dark .bg-slate-100 { background-color: #212a3d; }
        html.dark .hover\:bg-slate-100:hover { background-color: #263045; }
        html.dark .hover\:bg-slate-200:hover { background-color: #2c3750; }
        html.dark .border-slate-100 { border-color: #232d40; }
        html.dark .border-slate-200 { border-color: #2a3448; }
        html.dark .border-slate-300 { border-color: #364258; }
        html.dark .text-slate-900, html.dark .text-slate-800 { color: #e5e9f0; }
        html.dark .text-slate-700 { color: #cdd5e1; }
        html.dark .text-slate-600, html.dark .hover\:text-slate-600:hover { color: #aeb8c7; }
        html.dark .text-slate-500 { color: #8f9aab; }
        html.dark .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,.4); }

        html.dark .bg-blue-50 { background-color: rgba(59,130,246,.12); }
        html.dark .bg-blue-100, html.dark .hover\:bg-blue-50:hover { background-color: rgba(59,130,246,.22); }
        html.dark .bg-emerald-50 { background-color: rgba(16,185,129,.12); }
        html.dark .bg-emerald-100 { background-color: rgba(16,185,129,.22); }
        html.dark .bg-rose-50 { background-color: rgba(244,63,94,.12); }
        html.dark .bg-rose-100, html.dark .hover\:bg-rose-100:hover { background-color: rgba(244,63,94,.22); }
        html.dark .bg-sky-50 { background-color: rgba(14,165,233,.12); }
        html.dark .bg-amber-50 { background-color: rgba(245,158,11,.12); }
        html.dark .ring-offset-1 { --tw-ring-offset-color: #141b2a; }
        html.dark .text-amber-800 { color: #fcd34d; }
        html.dark .border-amber-300 { border-color: rgba(251,191,36,.4); }
        html.dark .bg-sky-100 { background-color: rgba(14,165,233,.22); }

        html.dark .text-blue-600, html.dark .text-blue-700, html.dark .text-blue-800, html.dark .text-blue-900 { color: #93c5fd; }
        html.dark .text-emerald-700, html.dark .text-emerald-800 { color: #6ee7b7; }
        html.dark .text-rose-600, html.dark .text-rose-700, html.dark .text-rose-800 { color: #fda4af; }
        html.dark .text-sky-600, html.dark .text-sky-700, html.dark .text-sky-800 { color: #7dd3fc; }

        html.dark .border-blue-100, html.dark .border-blue-200, html.dark .border-blue-300 { border-color: rgba(96,165,250,.35); }
        html.dark .border-emerald-200 { border-color: rgba(52,211,153,.35); }
        html.dark .border-rose-200 { border-color: rgba(251,113,133,.35); }
        html.dark .border-sky-200 { border-color: rgba(56,189,248,.35); }

        html.dark input, html.dark textarea { color: #e5e9f0; }
        html.dark input::placeholder, html.dark textarea::placeholder { color: #6b7688; }        
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-800">
    <div class="w-full max-w-sm sm:max-w-md">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/25 font-bold text-white text-2xl mx-auto mb-4">
                ☁
            </div>
            <div class="flex items-center justify-center space-x-2 mb-1">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Movistar WebDAV Proxy</h1>
            </div>
            <div class="flex items-center justify-center space-x-2 mt-1">
                <span class="text-xs font-mono font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-md border border-emerald-200">{{.Version}} (Go)</span>
            </div>
            <p class="text-xs text-slate-500 mt-2">Panel de Control y Gestión del Proxy</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
            {{if .Error}}
            <div id="error-alert" class="mb-5 p-3.5 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 flex items-start space-x-2.5">
                <span class="text-base leading-none">⚠️</span>
                <div class="flex-1 font-medium">{{.Error}}</div>
            </div>
            {{end}}

            <form id="loginForm" method="POST" action="/login" autocomplete="on" class="space-y-4">
                <!-- Username field optimized for password managers -->
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text"
                               id="username"
                               name="username"
                               value="{{.Username}}"
                               required
                               autocomplete="username"
                               autocapitalize="none"
                               autocorrect="off"
                               spellcheck="false"
                               placeholder="Nombre de usuario"
                               class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 font-medium transition" />
                    </div>
                </div>

                <!-- Password field optimized for password managers -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold text-slate-700">Contraseña</label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password"
                               id="password"
                               name="password"
                               required
                               autocomplete="current-password"
                               placeholder="Contraseña del panel"
                               class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 font-medium transition" />
                        <button type="button"
                                onclick="togglePasswordVisibility()"
                                tabindex="-1"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition"
                                title="Mostrar u ocultar contraseña">
                            <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg id="eye-off-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember me -->
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center space-x-2 text-xs text-slate-600 cursor-pointer select-none">
                        <input type="checkbox" id="remember" name="remember" value="1" checked class="w-4 h-4 rounded text-blue-600 border-slate-300 focus:ring-blue-500 transition" />
                        <span>Mantener sesión iniciada</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit"
                            id="loginBtn"
                            class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center space-x-2 text-sm">
                        <span>Iniciar Sesión</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center text-xs text-slate-400 space-y-1">
            <p>Acceso seguro para administración de copias y almacenamiento en la nube.</p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const eye = document.getElementById('eye-icon');
            const eyeOff = document.getElementById('eye-off-icon');
            if (!pwd || !eye || !eyeOff) return;
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.classList.add('hidden');
                eyeOff.classList.remove('hidden');
            } else {
                pwd.type = 'password';
                eye.classList.remove('hidden');
                eyeOff.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
